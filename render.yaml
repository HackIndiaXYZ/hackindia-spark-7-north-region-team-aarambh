services:
  # ---------------------------------
  # Backend API Service
  # ---------------------------------
  - type: web
    name: aegisgate-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: ohio
    plan: free # Change if you need more resources
    envVars:
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false # Paste a dummy value like "mongodb://localhost:27017/test" if you don't want to set this up right now
      - key: SUMSUB_APP_TOKEN
        sync: false
      - key: SUMSUB_SECRET_KEY
        sync: false
      - key: SECRET_SALT
        sync: false

  # ---------------------------------
  # Blockchain API Service
  # ---------------------------------
  - type: web
    name: aegisgate-blockchain
    env: docker
    dockerContext: ./blockchain
    dockerfilePath: ./blockchain/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: PORT
        value: 3002
      - key: CONTRACT_ADDRESS
        sync: false
      - key: RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false

  # ---------------------------------
  # Frontend Web Service
  # ---------------------------------
  - type: web
    name: aegisgate-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aegisgate-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_BLOCKCHAIN_URL
        fromService:
          type: web
          name: aegisgate-blockchain
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WLD_APP_ID
        sync: false
      - key: NEXT_PUBLIC_CONTRACT_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_RPC_URL
        sync: false
