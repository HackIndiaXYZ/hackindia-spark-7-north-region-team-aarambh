services:
  mongodb:
    image: mongo:latest
    container_name: aegisid_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aegisid_network

  backend:
    build:
      context: ./backend
    container_name: aegisid_backend
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/aegisid
      - PORT=3001
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - aegisid_network

  frontend:
    build:
      context: ./frontend
    container_name: aegisid_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aegisid_network
    environment:
      # Optional: set env variable for backend URL in Next.js if necessary
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001

networks:
  aegisid_network:
    driver: bridge

volumes:
  mongodb_data:
