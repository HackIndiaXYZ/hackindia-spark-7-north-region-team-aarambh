services:
  mongodb:
    image: mongo:latest
    container_name: aegisid_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aegisid_network

  backend:
    build:
      context: ./backend
    container_name: aegisid_backend
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/aegisid
      - PORT=3001
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - aegisid_network

  blockchain:
    build:
      context: ./blockchain
    container_name: aegisid_blockchain
    ports:
      - "3002:3002"
    env_file:
      - ./blockchain/.env
    networks:
      - aegisid_network

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_WLD_APP_ID=${NEXT_PUBLIC_WLD_APP_ID}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_BLOCKCHAIN_URL=${NEXT_PUBLIC_BLOCKCHAIN_URL}
        - NEXT_PUBLIC_CONTRACT_ADDRESS=${NEXT_PUBLIC_CONTRACT_ADDRESS}
    container_name: aegisid_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - blockchain
    networks:
      - aegisid_network
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_BLOCKCHAIN_URL=${NEXT_PUBLIC_BLOCKCHAIN_URL}
      - NEXT_PUBLIC_WLD_APP_ID=${NEXT_PUBLIC_WLD_APP_ID}
      - NEXT_PUBLIC_CONTRACT_ADDRESS=${NEXT_PUBLIC_CONTRACT_ADDRESS}

networks:
  aegisid_network:
    driver: bridge

volumes:
  mongodb_data:
